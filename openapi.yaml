x-voidly-coverage:
  servedVerified: false
components:
  responses:
    InvalidInput:
      description: Invalid method, query or body; inspect the endpoint contract.
    RateLimited:
      description: Rate limited; respect Retry-After.
    StorageUnavailable:
      description: The source could not be read or verified. Do not treat this as an empty catalog.
  schemas:
    AgentIdentity:
      type: object
      properties:
        did:
          type: string
          example: did:voidly:LCrb4B1V9ksKVTprP48hjD
        name:
          type:
          - string
          - 'null'
        signing_public_key:
          type: string
          description: Base64-encoded Ed25519 public key
        encryption_public_key:
          type: string
          description: Base64-encoded X25519 public key
        capabilities:
          type: array
          items:
            type: string
        metadata:
          type: object
        status:
          type: string
          enum:
          - active
          - inactive
        created_at:
          type: string
          format: date-time
        mlkem_public_key:
          type:
          - string
          - 'null'
          description: ML-KEM-768 post-quantum public key
        signed_prekey:
          type:
          - object
          - 'null'
          properties:
            public_key:
              type: string
            signature:
              type: string
            id:
              type: integer
    DirectoryCard:
      type: object
      additionalProperties: false
      required:
      - slug
      - url
      - name
      - description
      - brandPreset
      - publicationVersion
      - publicationDigest
      - publishedAt
      - serviceCount
      - services
      properties:
        slug:
          type: string
        url:
          type: string
          format: uri
        name:
          type: string
        description:
          type: string
        brandPreset:
          enum:
          - slate
          - ocean
          - forest
        publicationVersion:
          type: integer
          minimum: 1
        publicationDigest:
          type: string
          pattern: ^[0-9a-f]{64}$
        publishedAt:
          type: integer
        serviceCount:
          type: integer
          minimum: 1
          maximum: 16
        services:
          type: array
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required:
            - title
            - providerLabel
            - description
            properties:
              title:
                type: string
              providerLabel:
                type: string
              description:
                type: string
    DirectoryPage:
      type: object
      required:
      - version
      - sort
      - cards
      - nextCursor
      properties:
        version:
          const: voidpay.marketplace-directory.v1
        cards:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryCard'
        nextCursor:
          type:
          - string
          - 'null'
        sort:
          const: recently_published
    PublicServiceRef:
      type: object
      additionalProperties: false
      required:
      - providerId
      - serviceId
      - version
      - definitionDigest
      properties:
        providerId:
          type: string
        serviceId:
          type: string
        version:
          type: string
        definitionDigest:
          type: string
          pattern: ^[0-9a-f]{64}$
    ServicePage:
      type: object
      required:
      - version
      - observedAtMs
      - services
      - nextCursor
      - selectionGrantsAuthority
      - publicationPerformed
      properties:
        version:
          const: voidpay.qualified-service-inventory.v1
        observedAtMs:
          type: integer
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceProjection'
        nextCursor:
          oneOf:
          - type: string
            pattern: ^[0-9a-f]{64}$
          - type: 'null'
        selectionGrantsAuthority:
          const: false
        publicationPerformed:
          const: false
    ServiceProjection:
      type: object
      additionalProperties: false
      required:
      - version
      - projectionId
      - serviceRef
      - providerLabel
      - title
      - description
      - checkoutPath
      - access
      - operationalAvailability
      properties:
        version:
          const: voidpay.public-market-service.v1
        projectionId:
          type: string
        serviceRef:
          $ref: '#/components/schemas/PublicServiceRef'
        providerLabel:
          type: string
        title:
          type: string
        description:
          type: string
        checkoutPath:
          const: /pay/marketplace/checkout
        access:
          const: invited-only
        operationalAvailability:
          const: not-asserted
